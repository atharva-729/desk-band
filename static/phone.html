<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Desk Band · Phone</title>
<style>
  :root { --bg:#0e0f13; --panel:#181a21; --line:#2a2d38; --ink:#eef0f6; --dim:#8b90a3;
          --z1:#ff6b5a; --z2:#ffc23d; --z3:#3dd6a3; --z4:#5aa8ff; --ok:#3dd6a3; --warn:#ffc23d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, system-ui, sans-serif;
         padding:16px; min-height:100vh; user-select:none; -webkit-user-select:none; }
  h1 { font-size:20px; margin:0 0 2px; letter-spacing:.3px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:14px; }
  button, select { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line);
           border-radius:12px; padding:12px 14px; }
  button.primary { background:#ff6b5a; border-color:#ff6b5a; color:#14151a; font-weight:700; }
  button:disabled { opacity:.4; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .row > button { flex:1; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin:10px 0; }
  .meter { height:10px; background:#0a0b0e; border-radius:6px; position:relative; overflow:hidden; margin-top:6px; }
  .meter i { position:absolute; left:0; top:0; bottom:0; background:var(--ok); width:0; transition:width .05s; }
  .meter b { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--warn); }
  .grid { position:relative; display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .pad { position:relative; height:104px; border-radius:16px; border:2px solid var(--line); background:#13151b;
         display:flex; flex-direction:column; justify-content:center; align-items:center; transition:transform .08s, background .25s; }
  .pad .n { font-size:26px; font-weight:800; }
  .pad .c { font-size:12px; color:var(--dim); }
  .pad.training { border-style:dashed; }
  .pad.flash { transform:scale(1.04); }
  .phone { position:absolute; left:50%; top:50%; width:34px; height:58px; margin:-29px 0 0 -17px; border:2px solid var(--dim);
           border-radius:8px; background:var(--bg); pointer-events:none; z-index:1; }
  .phone:after { content:""; position:absolute; top:4px; left:50%; width:10px; height:3px; margin-left:-5px; background:var(--dim); border-radius:2px; }
  label { color:var(--dim); font-size:13px; }
  input[type=range] { width:100%; }
  .status { font-size:13px; color:var(--dim); }
  .big { font-size:15px; font-weight:600; }
  .prompt { text-align:center; padding:14px 0 6px; }
  .prompt .num { font-size:64px; font-weight:900; line-height:1; }
  .prompt .where { font-size:15px; color:var(--dim); margin-top:4px; }
  .hidden { display:none !important; }
  .setting { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; }
</style>
</head>
<body>
<h1>Desk Band</h1>
<div class="sub">Lay this phone flat on the table, top edge pointing away from you.</div>

<div id="intro" class="card">
  <div class="big">1. Start the sensors</div>
  <div class="status">Allow the microphone and motion access when asked. Keep this screen open.</div>
  <div class="row"><button id="start" class="primary">Start sensors</button></div>
</div>

<div id="main" class="hidden">
  <div class="card">
    <div class="status" id="info">…</div>
    <div class="meter"><i id="lvl"></i><b id="thr"></b></div>
    <label>Sensitivity <span id="sensVal"></span></label>
    <input id="sens" type="range" min="3" max="12" step="0.5" value="5">
    <div class="setting">
      <label for="resp">Response</label>
      <select id="resp">
        <option value="30">Fast (~45 ms, less accurate)</option>
        <option value="45" selected>Balanced (~60 ms)</option>
        <option value="70">Accurate (~85 ms)</option>
      </select>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px">
      <input id="echo" type="checkbox"> Anti-echo (only if the laptop's speakers sit on this table; slows fast playing)
    </label>
  </div>

  <div class="card">
    <div class="big" id="modeText">2. Teach it your spots</div>
    <div class="status" id="hint"></div>
    <div id="promptBox" class="prompt hidden"><div class="num" id="promptNum">1</div><div class="where" id="promptWhere"></div></div>
    <div class="grid" id="grid"><div class="phone"></div></div>
    <div class="row">
      <button id="guided" class="primary">Teach all spots (≈1 min)</button>
    </div>
    <div class="row">
      <button id="play" disabled>Play</button>
      <button id="stop" class="hidden">Stop</button>
    </div>
    <div class="status" id="acc"></div>
  </div>

  <div class="row">
    <button id="undo">Undo last tap</button>
    <button id="reset">Reset all</button>
    <button id="export">Export taps</button>
  </div>
  <div class="status" id="net"></div>
</div>

<script src="core.js"></script>
<script>
(() => {
  "use strict";
  const ZONES = [
    { id: 1, name: "Top left",     color: "#ff6b5a" },
    { id: 2, name: "Top right",    color: "#ffc23d" },
    { id: 4, name: "Bottom left",  color: "#5aa8ff" },
    { id: 3, name: "Bottom right", color: "#3dd6a3" },
  ]; // grid order, row by row
  const GUIDED_PER_ZONE = 15, TOPUP = 8, MIN_TO_PLAY = 6;
  const $ = (id) => document.getElementById(id);
  const zinfo = (id) => ZONES.find((z) => z.id === id);

  let det = null, ctx = null, model = null;
  let mode = "idle";            // idle | guided | topup | play
  let topupZone = null, queue = [], lastHit = null;
  const motion = [];
  let motionOK = false;

  // Training taps depend on how long we listen, so they're stored per Response setting.
  const storeKey = () => `deskband.v2.${$("resp").value}`;
  let samples = load();
  function load() { try { return JSON.parse(localStorage.getItem(storeKey())) || []; } catch { return []; } }
  let syncTimer = null;
  function save() {
    try { localStorage.setItem(storeKey(), JSON.stringify(samples)); } catch {}
    // also keep a copy on the laptop, so a fresh phone page is ready to play instantly
    clearTimeout(syncTimer);
    const resp = $("resp").value, body = JSON.stringify(samples);
    syncTimer = setTimeout(() => fetch(`/samples?resp=${resp}`, { method: "POST", headers: { "Content-Type": "application/json" }, body }).catch(() => {}), 600);
  }
  async function loadFromLaptop() {
    if (samples.length) return;
    try {
      const r = await fetch(`/samples?resp=${$("resp").value}`, { cache: "no-store" });
      const data = r.ok ? await r.json() : [];
      if (Array.isArray(data) && data.length) {
        samples = data;
        try { localStorage.setItem(storeKey(), JSON.stringify(samples)); } catch {}
        $("acc").textContent = `Loaded ${samples.length} training taps saved on the laptop.`;
      }
    } catch {}
  }
  const count = (id) => samples.filter((s) => s.zone === id).length;
  const ready = () => ZONES.every((z) => count(z.id) >= MIN_TO_PLAY);

  // ---------- pads ----------
  const padEls = {};
  for (const z of ZONES) {
    const el = document.createElement("div");
    el.className = "pad";
    el.innerHTML = `<div class="n">${z.id}</div><div>${z.name}</div><div class="c"></div>`;
    el.style.borderColor = z.color;
    el.addEventListener("click", () => padClicked(z.id));
    $("grid").appendChild(el);
    padEls[z.id] = el;
  }

  function padClicked(id) {
    if (mode === "play") return correctLast(id);
    if (mode === "guided") return;
    mode = "topup"; topupZone = id; topupTarget = count(id) + TOPUP; refresh();
  }
  let topupTarget = 0;

  function refresh() {
    for (const z of ZONES) {
      const el = padEls[z.id];
      el.querySelector(".c").textContent = mode === "play" ? "" : `${count(z.id)} taps`;
      el.classList.toggle("training", mode === "topup" && topupZone === z.id);
    }
    $("promptBox").classList.toggle("hidden", mode !== "guided");
    $("guided").classList.toggle("hidden", mode === "play" || mode === "guided");
    $("play").disabled = !ready();
    $("play").classList.toggle("hidden", mode === "play");
    $("play").classList.toggle("primary", ready());
    $("stop").classList.toggle("hidden", mode !== "play" && mode !== "guided" && mode !== "topup");
    $("stop").textContent = mode === "play" ? "Stop playing" : "Stop teaching";
    if (mode === "guided") {
      const z = zinfo(queue[0]);
      $("modeText").textContent = `Teaching · ${queue.length} knocks left`;
      $("hint").textContent = "Knock the spot shown. Mix soft and hard knocks — like you'd really play.";
      $("promptNum").textContent = z.id; $("promptNum").style.color = z.color; $("promptWhere").textContent = z.name;
    } else if (mode === "topup") {
      $("modeText").textContent = `Adding taps to spot ${topupZone}`;
      $("hint").textContent = `Knock ${zinfo(topupZone).name} ${TOPUP} times.`;
    } else if (mode === "play") {
      $("modeText").textContent = "Playing — knock away";
      $("hint").textContent = "Wrong pad? Tap the right pad on this screen and it learns from that knock.";
    } else {
      $("modeText").textContent = ready() ? "Ready" : "2. Teach it your spots";
      $("hint").textContent = ready()
        ? "Press Play. Tap a pad here to add more taps to just that spot."
        : "Press “Teach all spots”: the phone calls out spots in a random order and you knock each one.";
    }
  }

  function flash(id, strong) {
    const el = padEls[id];
    el.classList.add("flash");
    el.style.background = strong ? zinfo(id).color : "#2a2d38";
    setTimeout(() => { el.classList.remove("flash"); el.style.background = "#13151b"; }, 120);
  }

  // Touching the phone shakes it — ignore knocks for a moment afterwards.
  document.addEventListener("pointerdown", () => { if (det) det.muteUntilMs = performance.now() + 700; }, true);

  // ---------- sensors ----------
  function makeDetector() {
    det = new DeskCore.Detector(ctx.sampleRate, { thrMult: +$("sens").value, postMs: +$("resp").value });
  }
  $("start").addEventListener("click", async () => {
    try {
      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        try { motionOK = (await DeviceMotionEvent.requestPermission()) === "granted"; } catch { motionOK = false; }
      } else motionOK = typeof DeviceMotionEvent !== "undefined";
      window.addEventListener("devicemotion", (e) => {
        const a = e.acceleration;
        if (!a || a.x == null) return;
        const now = performance.now();
        motion.push({ t: now, x: a.x, y: a.y, z: a.z });
        while (motion.length && motion[0].t < now - 2000) motion.shift();
      });
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
      });
      ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
      await ctx.resume();
      const src = ctx.createMediaStreamSource(stream);
      const proc = ctx.createScriptProcessor(256, 1, 1); // small blocks = less waiting
      makeDetector();
      proc.onaudioprocess = (ev) => det.process(ev.inputBuffer.getChannelData(0), performance.now(), onHit);
      src.connect(proc); proc.connect(ctx.destination); // output stays silent
      try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch {}
      $("intro").classList.add("hidden"); $("main").classList.remove("hidden");
      $("info").textContent = `Mic ${(ctx.sampleRate / 1000).toFixed(1)} kHz · motion ${motionOK ? "on" : "off (mic only)"}`;
      setInterval(drawMeter, 50);
      await loadFromLaptop();
      if (ready()) trainModel();
      refresh();
    } catch (err) {
      alert("Could not start sensors: " + err.message + "\n\nOpen this page over https and allow the microphone.");
    }
  });

  function drawMeter() {
    if (!det) return;
    const toPct = (v) => Math.max(0, Math.min(100, (Math.log10(v + 1e-6) + 4) / 4 * 100));
    $("lvl").style.width = toPct(det.level) + "%";
    $("thr").style.left = toPct(det.threshold()) + "%";
  }
  $("sens").addEventListener("input", () => {
    $("sensVal").textContent = `(${$("sens").value} × noise — lower catches softer taps)`;
    if (det) det.thrMult = +$("sens").value;
  });
  $("sens").dispatchEvent(new Event("input"));
  $("resp").addEventListener("change", () => {
    samples = load(); model = null; $("acc").textContent = "";
    if (ctx) makeDetector();
    mode = "idle";
    loadFromLaptop().then(() => { if (ready()) trainModel(); refresh(); });
  });

  // ---------- each detected knock ----------
  function onHit(h) {
    if (mode === "idle") return;
    const f = DeskCore.audioFeatures(h.seg, det.sr).concat(DeskCore.accelFeatures(motion, h.wallMs, 40, +$("resp").value));
    const vel = Math.max(0.15, Math.min(1, Math.log10(h.peakAmp / h.thr + 1) / 1.3));
    if (mode === "guided") {
      const zone = queue.shift();
      samples.push({ zone, f }); save(); flash(zone, true);
      if (!queue.length) { mode = "idle"; trainModel(); }
      refresh();
    } else if (mode === "topup") {
      samples.push({ zone: topupZone, f }); save(); flash(topupZone, true);
      if (count(topupZone) >= topupTarget) { mode = "idle"; topupZone = null; if (ready()) trainModel(); }
      refresh();
    } else if (mode === "play" && model) {
      const p = model.predict(f);
      lastHit = { f, zone: p.zone };
      flash(p.zone, p.prob >= 0.5);
      const delay = Math.round(performance.now() - h.wallMs);
      const probs = {};
      model.classes.forEach((c, i) => (probs[c] = +p.probs[i].toFixed(3)));
      send({ type: "hit", zone: p.zone, prob: +p.prob.toFixed(3), vel: +vel.toFixed(3), delay, probs,
             fp: f.slice(0, 18).map((v) => +v.toFixed(2)), wave: envelope(h.seg, 60) });
      if ($("echo").checked) det.muteUntilMs = Math.max(det.muteUntilMs, performance.now() + 150);
    }
  }

  function correctLast(id) {
    if (!lastHit) return;
    samples.push({ zone: id, f: lastHit.f }); save();
    const was = lastHit.zone; lastHit = null;
    model = new DeskCore.Model().fit(samples.map((s) => s.f), samples.map((s) => s.zone), { iters: 300 });
    $("acc").textContent = `Learned: that knock was ${id}${was !== id ? ` (it guessed ${was})` : ""}. ${samples.length} taps total.`;
  }

  function shuffledQueue() {
    const q = [];
    for (const z of ZONES) for (let i = 0; i < GUIDED_PER_ZONE; i++) q.push(z.id);
    for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
    return q;
  }
  $("guided").addEventListener("click", () => { queue = shuffledQueue(); mode = "guided"; refresh(); });

  // ---------- model ----------
  function trainModel() {
    model = new DeskCore.Model().fit(samples.map((s) => s.f), samples.map((s) => s.zone));
    $("acc").textContent = "Checking accuracy…";
    setTimeout(() => {
      const idx = samples.map((_, i) => i).sort(() => Math.random() - 0.5);
      let ok = 0, n = 0;
      for (let k = 0; k < 4; k++) {
        const test = idx.filter((_, i) => i % 4 === k), train = idx.filter((_, i) => i % 4 !== k);
        const m = new DeskCore.Model().fit(train.map((i) => samples[i].f), train.map((i) => samples[i].zone), { iters: 300 });
        for (const i of test) { ok += m.predict(samples[i].f).zone === samples[i].zone; n++; }
      }
      const a = Math.round((100 * ok) / n);
      $("acc").textContent = `Estimated accuracy: ${a}% (random guessing = 25%).` +
        (a < 70 ? " Tip: spread the spots further apart, or knock different objects (a book, a box, the bare table)." : "");
    }, 30);
  }

  // What the knock looked like: a coarse loudness outline for the laptop's "How it hears" panel.
  function envelope(seg, n) {
    const out = [], step = seg.length / n;
    let max = 1e-9;
    for (let i = 0; i < n; i++) {
      let m = 0;
      for (let j = Math.floor(i * step); j < Math.floor((i + 1) * step); j++) m = Math.max(m, Math.abs(seg[j]));
      out.push(m); max = Math.max(max, m);
    }
    return out.map((v) => +(v / max).toFixed(2));
  }
  // Each spot's average "sound fingerprint", so the laptop can show which one a knock matched.
  function fingerprints() {
    const fps = {};
    for (const z of ZONES) {
      const rows = samples.filter((s) => s.zone === z.id);
      if (!rows.length) continue;
      fps[z.id] = rows[0].f.slice(0, 18).map((_, j) => +(rows.reduce((a, s) => a + s.f[j], 0) / rows.length).toFixed(2));
    }
    return fps;
  }
  $("play").addEventListener("click", () => {
    if (!model) trainModel();
    mode = "play"; refresh();
    send({ type: "ready", fingerprints: fingerprints(), taps: samples.length, acc: $("acc").textContent });
  });
  $("stop").addEventListener("click", () => { mode = "idle"; queue = []; topupZone = null; if (ready()) trainModel(); refresh(); });
  $("undo").addEventListener("click", () => { samples.pop(); save(); if (mode === "guided") mode = "idle"; refresh(); });
  $("reset").addEventListener("click", () => {
    if (!confirm("Delete all training taps for this Response setting?")) return;
    samples = []; model = null; save(); mode = "idle"; $("acc").textContent = ""; refresh();
  });
  $("export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ when: new Date().toISOString(), responseMs: +$("resp").value, samples }, null, 1)],
      { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "deskband-taps.json"; a.click();
  });

  // ---------- network ----------
  let sent = 0, failed = 0;
  function send(msg) {
    fetch("/hit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(msg), keepalive: true })
      .then((r) => { if (r.ok) sent++; else failed++; })
      .catch(() => failed++)
      .finally(() => { $("net").textContent = `Sent to laptop: ${sent}` + (failed ? ` · failed: ${failed}` : ""); });
  }

  refresh();
})();
</script>
</body>
</html>
